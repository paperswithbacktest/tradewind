# IBC settings for an IB Gateway that a scheduler can rely on: PAPER account, API writable,
# port 4002, daily auto-restart, Sunday cold restart, the usual dialogs closed.
#
# This is NOT a complete config.ini. Start from the config.ini shipped in the IBC release
# (it documents every setting), save it as ~/ibc/config.ini, and set the lines below in it.
# Then: chmod 600 ~/ibc/config.ini
#
# The login and password are left EMPTY on purpose. Fill them in yourself, in your copy only,
# never in a file under version control.

# --- Login (yours, in your copy only) ---------------------------------------------------
IbLoginId=
IbPassword=
# paper: use the paper account's own username (a live login works too, with a second factor)
TradingMode=paper
FIX=no

# --- API ------------------------------------------------------------------------------
# writable API: the run can place orders (it still only sends with --send)
ReadOnlyApi=no
ReadOnlyLogin=no
# IB Gateway's paper port. Gateway already defaults to it; IBC sets it at every start.
OverrideTwsApiPort=4002
# 127.0.0.1 is always accepted; any other address is refused without a dialog
AcceptIncomingConnectionAction=reject
TrustedTwsApiClientIPs=

# --- Daily restart and the Sunday logout ------------------------------------------------
# Gateway must restart every day. Auto-restart keeps the session (no new login) and takes
# place at this local time, away from the evening run. Format "hh:mm AM/PM".
AutoLogoffTime=
AutoRestartTime=06:00 AM
# IB ends every session once a week (Sunday, after 01:00 New York). At this local time on
# Sundays IBC closes Gateway and logs in again from scratch. 07:05 Paris is 01:05 or 02:05
# New York: after 01:00 all year. Adapt it to your time zone.
ColdRestartTime=07:05
# leave unset: Gateway keeps its settings in the folder the start script names
IbDir=

# --- Dialogs ----------------------------------------------------------------------------
# this session wins over a later login of the same user elsewhere (it reconnects)
ExistingSessionDetectedAction=primary
# the "this is a paper / non-brokerage account" warning
AcceptNonBrokerageAccountWarning=yes
DismissPasswordExpiryWarning=yes
BypassOrderPrecautions=yes
AllowBlindTrading=no
MinimizeMainWindow=yes

# --- Second factor: the paper username has none; a live login has one (see the docs) -----
ReloginAfterSecondFactorAuthenticationTimeout=no

# --- IBC's command server: off -----------------------------------------------------------
CommandServerPort=0
