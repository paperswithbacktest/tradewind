name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: pytest -q
      - name: clean-room guard (no backtrader in the engine)
        run: |
          ! grep -rnE "^\s*(import backtrader|from backtrader(\.[a-z_.]+)? import)" src/ || (echo "backtrader must never be imported by the engine" && exit 1)

  oracle:
    # backtrader lives only here, in a throwaway environment, as the equivalence oracle.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python tools/run_oracle.py --engine tradewind --out /tmp/oracle_tw.json
      - run: python -m venv /tmp/oracle-env && /tmp/oracle-env/bin/pip install -q backtrader numpy pandas
      - run: /tmp/oracle-env/bin/python tools/run_oracle.py --engine backtrader --out /tmp/oracle_bt.json
      - run: python tools/oracle_diff.py /tmp/oracle_bt.json /tmp/oracle_tw.json

  similarity:
    # Clean-room rule 4 as a gate: backtrader is installed (sha256-pinned) in a throwaway
    # environment and read by tools/similarity.py as hashes only; the job prints scores and
    # Tradewind locations, never the reference's code. It fails on any range of 41 tokens or
    # more not in spec/similarity-allowlist.json, then checks that a planted copy does fail.
    # Procedure to accept a range: spec/similarity-allowlist.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # the base is this standard library: see the allow-list
      - run: tools/similarity_gate.sh --control
