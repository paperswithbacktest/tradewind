name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: pytest -q
      - name: clean-room guard (no backtrader in the engine)
        run: |
          ! grep -rnE "^\s*(import backtrader|from backtrader(\.[a-z_.]+)? import)" src/ || (echo "backtrader must never be imported by the engine" && exit 1)
