[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradewind"
version = "0.0.2.dev0"
description = "An Apache 2.0 backtesting engine compatible with the backtrader API, built for depth and speed."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Papers With Backtest" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]
classifiers = [
  "Development Status :: 1 - Planning",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://paperswithbacktest.com"
Source = "https://github.com/paperswithbacktest/tradewind"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
